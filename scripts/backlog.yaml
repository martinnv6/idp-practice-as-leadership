# Backlog for this repository: epics, stories and defects.
# scripts/create_issues.py turns each entry into a GitHub issue.
# Story keys (L1, T1, S1, D1) are only used to link stories to epics here.
milestones:
  M1: "M1 Foundations and discovery"
  M2: "M2 Strategy and adoption"
  M3: "M3 Money, vendors and AI"
  M4: "M4 Executive readiness"
  T1: "T1 Understand the platform (optional lab)"

epics:
  - key: E1
    title: "Leadership: strategy and adoption"
    area: leadership
    milestone: M2
    body: |
      ## Outcome
      I can explain what the platform is, how I would start, what I would build first and how I would get teams to adopt it, each with a committed artefact for Forja Norte.

      ## Scope
      Exercises L1 to L5 in `leadership/03-practice-plan.md`.

      ## How we will know
      Five artefacts committed under `leadership/strategy/` and each answer rehearsed aloud.

  - key: E2
    title: "Leadership: measurement, governance and reporting"
    area: leadership
    milestone: M4
    body: |
      ## Outcome
      I can show whether the platform works with DX Core 4 and an adoption funnel, decide on rules and exceptions, learn from an incident, and report it to an executive committee in ten minutes.

      ## Scope
      Exercises L6, L7, L12 and L13 in `leadership/03-practice-plan.md`.

      ## How we will know
      Filled scorecard, one exception decision, one postmortem and a rehearsed quarterly report.

  - key: E3
    title: "Leadership: money, vendors, AI and people"
    area: leadership
    milestone: M3
    body: |
      ## Outcome
      I have a method, with worked examples, for budget and TCO, vendor management, an AI programme, and structuring and hiring a team.

      ## Scope
      Exercises L8 to L11 in `leadership/03-practice-plan.md`.

      ## How we will know
      Budget and memo, vendor scorecard and SLA clauses, AI rollout plan and two role scorecards committed, each defended against its counterpart agent.

  - key: E4
    title: "Technical: understand how an IDP works"
    area: technical
    milestone: T1
    body: |
      ## Outcome
      I can name the parts of an IDP, describe the path of a change from template to production, and ask an engineer the right questions. Building the lab is optional.

      ## Scope
      Reading in `technical/`, exercise L14 and optional phases of `technical/04-build-plan.md`.

      ## How we will know
      A five-minute end-to-end explanation given twice, once without product names.

  - key: E5
    title: "Repository and GitHub setup"
    area: technical
    milestone: M1
    body: |
      ## Outcome
      The repository is on GitHub with a green pipeline, a wiki and a project board, and its known gaps are tracked as defects.

stories:
  # ---- E1 ----
  - {key: L1, epic: E1, area: leadership, milestone: M1, title: "L1 · Define the platform and its charter",
     story: "As head of the office, I want a charter in my own words and a 20-second definition, so that I can answer what the platform is and is not.",
     acceptance: ["Mission, scope and out-of-scope rewritten in `leadership/strategy/platform-charter.md`", "20-second definition said aloud twice without reading"]}
  - {key: L2, epic: E1, area: leadership, milestone: M1, title: "L2 · Discovery and baseline",
     story: "As head of the office, I want an interview guide, a friction log and a baseline, so that priorities rest on evidence.",
     acceptance: ["Interview guide for developers, tech leads and vendor leads", "Friction log from three personas using the developer-customer agent", "Value stream of one change with wait times", "Baseline table: which numbers exist and how to get the rest", "Committed as `leadership/strategy/discovery-notes.md`"]}
  - {key: L3, epic: E1, area: leadership, milestone: M2, title: "L3 · Roadmap and prioritisation",
     story: "As head of the office, I want a four-quarter roadmap with a not-now list, so that I can explain what we do and what we decline.",
     acceptance: ["Backlog items scored by reach, friction, risk and effort", "`leadership/strategy/roadmap.md` edited with one outcome per quarter", "Answer prepared for a director whose request was declined"]}
  - {key: L4, epic: E1, area: leadership, milestone: M2, title: "L4 · Golden-path plan",
     story: "As head of the office, I want a plan for the first golden path, so that one team ships on it within a quarter.",
     acceptance: ["Stack scoring table filled in `leadership/strategy/golden-path-plan.md`", "Scope of version 0.1, pilot teams, support model and exit defined", "Scope challenged by the platform-engineer agent", "Choice recorded as an ADR"]}
  - {key: L5, epic: E1, area: leadership, milestone: M2, title: "L5 · Adoption plan",
     story: "As head of the office, I want an adoption plan with funnel targets and tactics per segment, so that adoption grows by pull and not by mandate.",
     acceptance: ["Quarterly funnel targets", "Team segments with a tactic each", "Role of Hub Leaders and champions", "Role-play with a sceptical tech lead and a vendor lead", "Committed as `leadership/strategy/adoption-plan.md`"]}
  # ---- E2 ----
  - {key: L6, epic: E2, area: leadership, milestone: M2, title: "L6 · Measurement with DX Core 4",
     story: "As head of the office, I want a one-page Core 4 scorecard with baselines and targets, so that I can show whether the platform works.",
     acceptance: ["Scorecard table filled in `leadership/measurement/dx-core-4.md`", "One past result of my own translated, with gaps marked", "Counter-metric named for every number"]}
  - {key: L7, epic: E2, area: leadership, milestone: M2, title: "L7 · Governance and exceptions",
     story: "As head of the office, I want to decide a new mandatory control and one exception request, so that I can explain how I balance mandate and autonomy.",
     acceptance: ["Written decision: mandate now or SHOULD for a quarter", "One exception file under `leadership/governance/exceptions/`", "How exceptions are reported to the committee"]}
  - {key: L12, epic: E2, area: leadership, milestone: M4, title: "L12 · Incident and continuity",
     story: "As head of the office, I want a postmortem and a continuity outline for a platform outage, so that I can describe post-incident improvement.",
     acceptance: ["Postmortem filled from `leadership/governance/postmortem-template.md`", "Actions split into backlog items and directives", "Half-page continuity outline"]}
  - {key: L13, epic: E2, area: leadership, milestone: M4, title: "L13 · Quarterly executive report",
     story: "As head of the office, I want a one-page quarterly report and a ten-minute talk, so that I can answer what I would show in twelve months.",
     acceptance: ["`leadership/measurement/quarterly-report-template.md` filled for Forja Norte", "Rehearsed twice in ten minutes", "Questions taken from the exec-committee agent"]}
  # ---- E3 ----
  - {key: L8, epic: E3, area: leadership, milestone: M3, title: "L8 · Budget and TCO",
     story: "As head of the office, I want a budget and a build-or-buy memo, so that I can justify the investment.",
     acceptance: ["Assumptions in `leadership/finops/scenarios.csv` replaced with defensible figures", "`leadership/finops/budget-template.csv` filled", "One-page memo with break-even point", "Defended against the finops-partner agent"]}
  - {key: L9, epic: E3, area: leadership, milestone: M3, title: "L9 · Delivery vendors",
     story: "As head of the office, I want outcome-based SLA clauses, a scorecard and a QBR run, so that I can manage a vendor that underperforms.",
     acceptance: ["Five SLA clauses tied to platform data", "`leadership/vendors/vendor-scorecard.md` filled for one vendor", "QBR run against the vendor-account-manager agent", "Improvement plan and remedy ladder"]}
  - {key: L10, epic: E3, area: leadership, milestone: M3, title: "L10 · AI programme",
     story: "As head of the office, I want an AI rollout and measurement plan, so that AI use is governed and its effect is reported honestly.",
     acceptance: ["Approved tools, pilot cohort, catalog, rules and budget", "Measurement plan with baseline, cohorts and sample size", "Answer to why ROI cannot be shown yet", "Committed as `leadership/ai/rollout-plan.md`"]}
  - {key: L11, epic: E3, area: leadership, milestone: M3, title: "L11 · Team and hiring",
     story: "As head of the office, I want role scorecards and a hiring order, so that I can explain how I would build the team.",
     acceptance: ["Role scorecard for a Platform Engineer", "Role scorecard for a Hub Leader", "Hiring order with reasons", "How to lead matrix Hub Leaders"]}
  # ---- E4 ----
  - {key: L14, epic: E4, area: technical, milestone: T1, title: "L14 · Explain the IDP end to end",
     story: "As head of the office, I want to explain what happens when a developer uses the platform, so that I am credible with engineers and clear with executives.",
     acceptance: ["Read `technical/01-idp-anatomy.md`", "Flow drawn from Create to running in production", "Explained in five minutes without product names, then with them", "Corrected by the platform-engineer agent"]}
  - {key: T1, epic: E4, area: technical, milestone: T1, title: "T1 · Read the architecture and tooling options",
     story: "As a leader, I want to know the capability list and the options per layer, so that I can judge a tooling proposal.",
     acceptance: ["Read `technical/02-reference-architecture.md` and `technical/03-tooling-options.md`", "Ten questions written that I would ask an engineer proposing a portal"]}
  - {key: T2, epic: E4, area: technical, milestone: T1, title: "T2 · Optional: run the local platform and portal (phases 1 and 2)",
     story: "As a learner, I want a running local platform with a portal and catalog, so that the vocabulary is concrete.",
     acceptance: ["Phases 1 and 2 of `technical/04-build-plan.md` done", "Versions and problems logged under `technical/lab/log/`", "Catalog files under `technical/platform/catalog/` loaded or corrected"]}
  - {key: T3, epic: E4, area: technical, milestone: T1, title: "T3 · Optional: golden path 0.1 with the standard pipeline (phase 3)",
     story: "As a learner, I want one service created from a template and deployed by the standard pipeline, so that I have seen self-service end to end.",
     acceptance: ["Template skeleton written", "Service reaches a dev environment with no manual step", "Time to first deploy recorded"]}
  - {key: T4, epic: E4, area: technical, milestone: T1, title: "T4 · Optional: guardrails and metrics (phases 5 and 7)",
     story: "As a learner, I want policies in audit mode and delivery metrics for two services, so that I can show a pass rate and a before-and-after.",
     acceptance: ["Policies applied in audit mode and corrected", "Pass rate by team captured", "Delivery metrics shown for a golden-path and a legacy service"]}
  # ---- E5 ----
  - {key: S1, epic: E5, area: technical, milestone: M1, title: "S1 · Push the repository and get the validate workflow green",
     story: "As the owner, I want the repository on GitHub with a passing pipeline, so that every later change is checked.",
     acceptance: ["`git push -u origin main` done", "The validate workflow passes on main"]}
  - {key: S2, epic: E5, area: technical, milestone: M1, title: "S2 · Create the wiki and publish the pages",
     story: "As the owner, I want the wiki populated from `wiki/`, so that there is a short guide to the repository.",
     acceptance: ["First wiki page created by hand so the wiki repository exists", "publish-wiki workflow run and corrected if needed", "Home, Leadership track, Technical track and How we work visible"]}
  - {key: S3, epic: E5, area: technical, milestone: M1, title: "S3 · Create the project board",
     story: "As the owner, I want a project with all issues, so that progress is visible on one board.",
     acceptance: ["`bash scripts/bootstrap-github.sh` run", "Board view grouped by status", "Table view grouped by area label"]}

defects:
  - {key: D1, area: technical, title: "Starter platform configuration has never been run",
     kind: "Untested configuration",
     what: "The Backstage catalog and template, Kyverno policies, Dex config, Score file and the reusable pipeline under `technical/platform/` only pass a YAML syntax check. Field names and API versions may not match current tool versions.",
     expected: "Each file applied in its build-plan phase and corrected, or its header kept as untested."}
  - {key: D2, area: docs, title: "Framework details written from memory need checking",
     kind: "Incorrect or unverified fact",
     what: "CNPA domain weights in `docs/standards-map.md`, the secondary metrics of DX Core 4 in `leadership/measurement/dx-core-4.md`, and the level names of the CNCF maturity model were written from memory.",
     expected: "Each checked against the primary source in `docs/references.md` and corrected."}
  - {key: D3, area: leadership, title: "Licence prices come from third-party summaries",
     kind: "Incorrect or unverified fact",
     what: "The GitHub Enterprise Cloud and GitHub Copilot prices in `leadership/finops/licenses.csv` were taken from third-party articles dated 2026, not from the vendor's pricing pages. All other prices are blank.",
     expected: "Prices confirmed on the vendor pages with the date, and blank rows filled from quotes."}
  - {key: D4, area: docs, title: "Reddit source could not be read; five-function IDP model written from memory",
     kind: "Incorrect or unverified fact",
     what: "The Reddit post listed in `docs/references.md` could not be opened. The five core functions in `technical/01-idp-anatomy.md` follow the commonly cited model and were not checked against that post.",
     expected: "Post read by hand and the anatomy page adjusted if it differs."}
  - {key: D5, area: technical, title: "GitHub automation is untested",
     kind: "Untested configuration",
     what: "`.github/workflows/publish-wiki.yml`, `scripts/bootstrap-github.sh` and `scripts/create_issues.py` have not been run against GitHub.",
     expected: "Each run once and fixed."}
