name: Story
description: A piece of work with a clear outcome
title: "[Story] "
labels: ["type:story"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - leadership
        - technical
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Story
      description: As a <role>, I want <outcome>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist of what must be true to close this.
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: files
    attributes:
      label: Files
      description: Repo paths this story reads or produces.
  - type: input
    id: measure
    attributes:
      label: Number or artefact to capture
