# Business domains and systems of Forja Norte (fictional).
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: manufacturing
  description: Shop-floor execution, production tracking and quality
spec:
  owner: delivery
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: supply-chain
  description: Order promising, logistics and yard management
spec:
  owner: delivery
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: developer-platform
  description: The internal developer platform itself
spec:
  owner: seo
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: production-tracking
  description: Tracks coils through the hot and cold rolling lines
  annotations:
    forjanorte.example/tier: "1"
spec:
  owner: team-mfg-tracking
  domain: manufacturing
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: yard-management
  description: Truck and rail yard scheduling
  annotations:
    forjanorte.example/tier: "2"
spec:
  owner: team-scm-yard
  domain: supply-chain
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: idp
  description: Portal, golden paths, pipelines, policy and metrics
  annotations:
    forjanorte.example/tier: "2"
spec:
  owner: seo-platform
  domain: developer-platform
