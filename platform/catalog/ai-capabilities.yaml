# AI capabilities registered in the catalog (Phase 9).
# Backstage has no built-in kind for these, so they are modelled as Resource
# and Component entities with a custom spec.type. Names are illustrative.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: mcp-issue-tracker
  title: MCP server · issue tracker
  description: Lets approved agents read and comment on tickets
  annotations:
    forjanorte.example/approval-status: approved
    forjanorte.example/max-data-classification: internal
    forjanorte.example/scopes: "read:issues, write:comments"
    forjanorte.example/reviewed-on: "2026-11-15"
  tags: [ai, mcp]
spec:
  type: mcp-server
  owner: seo-platform
  system: idp
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: mcp-source-control
  title: MCP server · source control
  description: Lets approved agents read repositories and open pull requests
  annotations:
    forjanorte.example/approval-status: approved
    forjanorte.example/max-data-classification: confidential
    forjanorte.example/scopes: "read:repo, write:pull-request"
    forjanorte.example/reviewed-on: "2026-11-15"
  tags: [ai, mcp]
spec:
  type: mcp-server
  owner: seo-platform
  system: idp
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: engineering-skills
  title: Shared agent skills
  description: Versioned skills for agents (ticket triage, defect analysis, release notes)
  annotations:
    forjanorte.example/approval-status: approved
  tags: [ai, skills]
spec:
  type: library
  lifecycle: experimental
  owner: seo-hub-leaders
  system: idp
  dependsOn:
    - resource:mcp-issue-tracker
    - resource:mcp-source-control
