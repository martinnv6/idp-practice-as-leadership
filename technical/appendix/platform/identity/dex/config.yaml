# Dex configuration for the lab (Phase 4). Untested starter.
#
# Dex stores no users. It brokers logins from upstream identity sources
# ("connectors") and issues OIDC tokens to the platform tools ("staticClients").
#
# Lab note: Dex's built-in static passwords carry no group claim, so the lab
# uses a small LDAP directory to get groups. In a company the LDAP connector
# is replaced by the corporate-directory connector (employees) plus one connector per
# delivery vendor.
#
# Secrets are read from environment variables. Never commit real values.
issuer: https://dex.cnoe.localtest.me:8443

storage:
  type: kubernetes
  config:
    inCluster: true

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

connectors:
  # Lab directory with groups: dpg-platform, dpg-guild-leads,
  # team-hub-sortation (employees), vendor-altos-delivery (contractors).
  - type: ldap
    id: lab-directory
    name: Lab directory
    config:
      host: openldap.identity.svc.cluster.local:389
      insecureNoSSL: true
      bindDN: cn=admin,dc=kestrel,dc=example
      bindPW: $LDAP_BIND_PASSWORD
      userSearch:
        baseDN: ou=people,dc=kestrel,dc=example
        username: uid
        idAttr: uid
        emailAttr: mail
        nameAttr: cn
      groupSearch:
        baseDN: ou=groups,dc=kestrel,dc=example
        userMatchers:
          - userAttr: DN
            groupAttr: member
        nameAttr: cn

  # Optional: log in with a real GitHub account; org teams become groups.
  # - type: github
  #   id: github
  #   name: GitHub
  #   config:
  #     clientID: $GITHUB_CLIENT_ID
  #     clientSecret: $GITHUB_CLIENT_SECRET
  #     redirectURI: https://dex.cnoe.localtest.me:8443/callback
  #     orgs:
  #       - name: your-org
  #     teamNameField: slug

  # In a company, employees come through a connector to the corporate
  # directory (OIDC, SAML or LDAP) and each vendor through its own connector.

staticClients:
  - id: backstage
    name: Developer Portal
    secretEnv: BACKSTAGE_CLIENT_SECRET
    redirectURIs:
      - https://cnoe.localtest.me:8443/api/auth/oidc/handler/frame
  - id: argocd
    name: Argo CD
    secretEnv: ARGOCD_CLIENT_SECRET
    redirectURIs:
      - https://cnoe.localtest.me:8443/argocd/auth/callback
  - id: grafana
    name: Grafana
    secretEnv: GRAFANA_CLIENT_SECRET
    redirectURIs:
      - https://cnoe.localtest.me:8443/grafana/login/generic_oauth

# Group to role mapping lives in each tool, driven by the "groups" claim:
#   dpg-platform           -> admin everywhere
#   dpg-guild-leads        -> read everywhere, approve promotions for their stack
#   team-*                 -> deploy to own namespaces in all environments
#   vendor-*               -> deploy to own dev and staging; propose changes to prod
