# Developer-facing workload spec (Score, score.dev).
# The developer states what the service needs. The platform decides how each
# environment provides it. Untested starter; check field names against the
# Score spec version you install.
apiVersion: score.dev/v1b1
metadata:
  name: parcel-scan-api
  annotations:
    kestrel.example/tier: "1"
    kestrel.example/owner: team-hub-sortation

service:
  ports:
    http:
      port: 80
      targetPort: 8080

containers:
  api:
    image: .
    variables:
      SERVER_PORT: "8080"
      DB_CONNECTION: "Host=${resources.db.host};Port=${resources.db.port};Database=${resources.db.name};Username=${resources.db.username};Password=${resources.db.password}"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080

resources:
  db:
    type: postgres
  dns:
    type: dns
  route:
    type: route
    params:
      host: ${resources.dns.host}
      path: /
      port: 80
