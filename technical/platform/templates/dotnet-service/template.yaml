# Golden path #1: .NET service (Phase 3).
# Untested starter. The ./skeleton folder is written in Phase 3.
# Action names (publish:gitea, etc.) depend on the scaffolder modules installed;
# with GitHub use publish:github.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dotnet-service
  title: .NET service (golden path)
  description: >
    A production-ready ASP.NET service with CI, quality gates, signed image,
    GitOps deployment, telemetry, docs and catalog registration.
  tags: [dotnet, golden-path, recommended]
  annotations:
    forjanorte.example/golden-path-version: "0.1.0"
spec:
  owner: seo-platform
  type: service

  parameters:
    - title: About the service
      required: [name, description, owner, system]
      properties:
        name:
          title: Name
          type: string
          description: Lowercase, digits and dashes
          pattern: "^[a-z][a-z0-9-]{2,40}$"
        description:
          title: Description
          type: string
        owner:
          title: Owner team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        system:
          title: System
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
    - title: Classification (drives policy and cost allocation)
      required: [tier, dataClassification, costCenter]
      properties:
        tier:
          title: Tier
          type: string
          enum: ["1", "2", "3"]
          enumNames:
            - "1 · plant or revenue stops"
            - "2 · business process degraded"
            - "3 · internal convenience"
          default: "3"
        dataClassification:
          title: Data classification
          type: string
          enum: [public, internal, confidential, restricted]
          default: internal
        costCenter:
          title: Cost center
          type: string
          pattern: "^CC-[A-Z]{3}-[0-9]{4}$"
        soxScope:
          title: In SOX scope
          type: boolean
          default: false

  steps:
    - id: fetch
      name: Generate from skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          tier: ${{ parameters.tier }}
          dataClassification: ${{ parameters.dataClassification }}
          costCenter: ${{ parameters.costCenter }}
          soxScope: ${{ parameters.soxScope }}

    - id: publish
      name: Create repository
      action: publish:gitea
      input:
        repoUrl: gitea.cnoe.localtest.me:8443?owner=giteaAdmin&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        defaultBranch: main

    - id: register
      name: Register in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
