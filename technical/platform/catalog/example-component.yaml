# What a compliant service looks like in the catalog.
# The golden-path template generates this file; legacy services add it by hand.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: coil-tracking-api
  title: Coil Tracking API
  description: Exposes coil position and status for the rolling lines
  annotations:
    backstage.io/techdocs-ref: dir:.
    forjanorte.example/tier: "1"
    forjanorte.example/data-classification: internal
    forjanorte.example/cost-center: CC-MFG-0420
    forjanorte.example/golden-path: dotnet-service
    forjanorte.example/golden-path-version: "0.1.0"
    forjanorte.example/sox-scope: "false"
  tags: [dotnet, api]
  links:
    - title: Dashboard
      url: https://grafana.example.invalid/d/coil-tracking-api
    - title: Runbook
      url: https://portal.example.invalid/docs/default/component/coil-tracking-api/runbook
spec:
  type: service
  lifecycle: production
  owner: team-mfg-tracking
  system: production-tracking
  providesApis: [coil-tracking]
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: coil-tracking
  description: REST API for coil position and status
spec:
  type: openapi
  lifecycle: production
  owner: team-mfg-tracking
  system: production-tracking
  definition: |
    openapi: 3.0.3
    info:
      title: Coil Tracking
      version: 0.1.0
    paths:
      /coils/{id}:
        get:
          summary: Get a coil by id
          parameters:
            - name: id
              in: path
              required: true
              schema:
                type: string
          responses:
            "200":
              description: The coil
